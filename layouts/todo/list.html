{{ define "main" }}
<div class="todo-page">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="todo-grid">
    {{- range hugo.Data.todo }}
    <article class="todo-card">
      <div class="todo-card-header">
        <span class="todo-checkbox" aria-hidden="true"></span>
        <h2 class="todo-name">{{ .name }}</h2>
      </div>
      {{- with .remark }}
      <p class="todo-remark">{{ . }}</p>
      {{- end }}
    </article>
    {{- end }}
  </div>
</div>
{{ end }}
