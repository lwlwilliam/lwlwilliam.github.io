{{ define "main" }}
<div class="links-page">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="link-grid">
    {{- range hugo.Data.links }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="link-card">
      <h2 class="link-card-name">{{ .name }}</h2>
      <span class="link-card-arrow" aria-hidden="true">↗</span>
    </a>
    {{- end }}
  </div>
</div>
{{ end }}
