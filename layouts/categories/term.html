{{ define "main" }}
{{- $paginator := .Paginate .Pages }}
<div class="category-term-page">
  <h1 class="page-title">{{ .Title }} <span class="category-term-count">{{ len .Pages }}</span></h1>
  <div class="post-list">
    {{- range $paginator.Pages }}
      {{- partial "post-card.html" . }}
    {{- end }}
  </div>
  {{- if gt $paginator.TotalPages 1 }}
    {{- partial "pagination.html" $paginator }}
  {{- end }}
</div>
{{ end }}
