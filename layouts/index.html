{{ define "main" }}
<div class="home-page">
  <h1 class="sr-only">最新文章</h1>
  {{- $paginator := .Paginate (where site.RegularPages "Type" "posts") }}
  <div class="post-list">
    {{- range $paginator.Pages }}
      {{- partial "post-card.html" . }}
    {{- end }}
  </div>
  {{- if gt $paginator.TotalPages 1 }}
    {{- partial "pagination.html" $paginator }}
  {{- end }}
</div>
{{ end }}
