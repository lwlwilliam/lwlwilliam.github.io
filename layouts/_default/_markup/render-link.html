{{- $url := .Destination -}}
{{- if findRE `^(?:\.\./)+static/` $url -}}
  {{- $url = replaceRE `^(?:\.\./)+static/` "" $url -}}
  {{- $url = printf "/%s" $url -}}
{{- end -}}
{{- $isWebLink := or (strings.HasPrefix $url "http://") (strings.HasPrefix $url "https://") -}}
<a href="{{ $url }}"{{ if $isWebLink }} target="_blank" rel="noopener noreferrer"{{ end }}{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
