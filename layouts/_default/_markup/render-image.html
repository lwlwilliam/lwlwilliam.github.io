{{- $url := .Destination -}}
{{- if findRE `^(?:\.\./)+static/` $url -}}
  {{- $url = replaceRE `^(?:\.\./)+static/` "" $url -}}
  {{- $url = printf "/%s" $url -}}
{{- end -}}
<span class="img-figure">
  <img
    src="{{ $url }}"
    alt="{{ .Text | plainify }}"
    loading="lazy"
    decoding="async"
    class="img-lazy"
    {{- with .Title }} title="{{ . }}"{{ end }}>
  <span class="img-shimmer" aria-hidden="true">
    <span class="img-shimmer-track"></span>
    <svg class="img-shimmer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="m21 15-5-5L5 21"/>
    </svg>
  </span>
</span>
