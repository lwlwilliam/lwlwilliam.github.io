<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}" class="no-js">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  {{- partial "header.html" . }}
  {{- partial "search.html" . }}

  <main class="main-content" id="main-content" tabindex="-1">
    {{- block "main" . }}{{ end }}
  </main>

  {{- partial "footer.html" . }}

  <button type="button" class="back-to-top" id="backToTop" data-back-to-top aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  {{- $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- block "scripts" . }}{{ end }}
</body>
</html>
