# ===== 站点 =====
baseURL = 'https://pages.lwlinux.cn/'
publishDir = 'docs'
relativeURLs = true
locale = 'zh-cn'
title = 'William A'

[params]
  description = 'Love sports, love programming, love life.'
  keywords = [ 'William A' ]
  about = 'Just for fun.'
  beian = '粤ICP备20026636号-1'
  author = 'William A'
  paginationWindow = 2
  excerptLength = 150

# ===== 导航（Hugo 标准菜单）=====
[[menus.main]]
  name = 'cd ~'
  pageRef = '/'
  weight = 1

[[menus.main]]
  name = 'Categories'
  pageRef = '/categories'
  weight = 2

[[menus.main]]
  name = 'Archives'
  pageRef = '/archives'
  weight = 3

[[menus.main]]
  name = 'Books'
  pageRef = '/books'
  weight = 4

[[menus.main]]
  name = 'Links'
  pageRef = '/links'
  weight = 5

[[menus.main]]
  name = 'Tools'
  pageRef = '/tools'
  weight = 6

[[menus.main]]
  name = 'Todo'
  pageRef = '/todo'
  weight = 7

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 8

[pagination]
  pagerSize = 5

# ===== 分类与固定链接 =====
[taxonomies]
  category = 'categories'

[permalinks]
  posts = '/:year/:month/:day/:slug/'

# ===== 输出 =====
[outputs]
  home = ['HTML', 'RSS', 'SearchJSON']
  page = ['HTML']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[outputFormats.RSS]
  baseName = 'feed'

[outputFormats.SearchJSON]
  mediaType = 'application/json'
  baseName = 'search'
  isPlainText = true
  notAlternative = true

[services.rss]
  limit = 20

# ===== Markdown =====
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    # 使用 class 高亮；亮/暗主题的配比在 assets/css/syntax.css。
    noClasses = false
    style = 'github'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
